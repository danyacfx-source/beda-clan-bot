[project]
name = "discord-mega-bot"
version = "3.3.0"
description = "Модульный Discord-бот: модерация, музыка, администрирование"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0,<2.6",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.1",
    "PyNaCl>=1.5.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = [
    "app/types.py",
    "app/db/moderation_cases_repository.py",
    "app/db/reminders_repository.py",
    "app/db/scheduled_repository.py",
    "app/db/giveaways_repository.py",
    "app/services/moderation_case_service.py",
]
follow_imports = "skip"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true

# discord.py exposes Cog/command metadata through metaclass keyword arguments.
# The available stubs model those classes as object.__init_subclass__, so mypy
# reports false positives for valid declarations such as ``class X(MegaCog,
# name="X")``. Other call-site errors remain enabled.
[[tool.mypy.overrides]]
module = ["app.cogs.*"]
disable_error_code = ["call-arg"]
